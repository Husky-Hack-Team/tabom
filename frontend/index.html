<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabom</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    input, button { padding: 8px; font-size: 1rem; }
    li { margin: 4px 0; }
    #status { color: #666; }
  </style>
</head>
<body>
  <h1>Tabom</h1>
  <p id="status">Verificando backend...</p>

  <form id="form">
    <input id="name" placeholder="Nome do item" required>
    <button>Adicionar</button>
  </form>
  <ul id="list"></ul>

  <script>
    const API = "https://tabom.azurewebsites.net";

    async function loadItems() {
      const items = await (await fetch(`${API}/items`)).json();
      document.getElementById("list").innerHTML =
        items.map(i => `<li>#${i.id} ${i.name}</li>`).join("");
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("name");
      await fetch(`${API}/items`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: input.value }),
      });
      input.value = "";
      loadItems();
    });

    fetch(`${API}/health`)
      .then(r => r.json())
      .then(() => { document.getElementById("status").textContent = "Backend online ✅"; loadItems(); })
      .catch(() => { document.getElementById("status").textContent = "Backend offline ❌"; });
  </script>
</body>
</html>
